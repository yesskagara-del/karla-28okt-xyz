<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Try Out TKA Bahasa Inggris</title>
<style>
:root{--bg:#f4f6fb;--c:#fff;--t:#1f2430;--m:#6b7280;--p:#3b5bdb;--l:#e5e9f5;--ok:#2f9e44;--no:#e03131;--w:#f59f00}
@media(prefers-color-scheme:dark){:root{--bg:#14171f;--c:#1e222d;--t:#e8eaf0;--m:#9aa3b5;--p:#748ffc;--l:#303646}}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,sans-serif;background:var(--bg);color:var(--t)}
.w{max-width:760px;margin:auto;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:8px 0}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:16px;margin-bottom:12px}
.hd{background:#d00;color:#fff;display:inline-block;padding:2px 8px;font-size:14px;font-weight:600;margin-bottom:8px}
.hint{color:var(--m);font-size:14px;margin:4px 0 10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--l);border-radius:10px;padding:10px;margin:8px 0;cursor:pointer}
.opt.sel{border-color:var(--p);background:rgba(59,91,219,.1)}
.opt.ok{border-color:var(--ok);background:rgba(47,158,68,.15)}.opt.bad{border-color:var(--no);background:rgba(224,49,49,.13)}
.bx{min-width:24px;height:24px;border:1.5px solid var(--m);border-radius:6px;display:grid;place-items:center;font-size:13px;font-weight:700}
.opt.sel .bx{background:var(--p);color:#fff;border-color:var(--p)}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid var(--l);padding:7px;text-align:center}td:first-child{text-align:left}
th{background:rgba(59,91,219,.1)}td.c{cursor:pointer;font-weight:700}td.sel{background:rgba(59,91,219,.25)}td.ok{background:rgba(47,158,68,.3)}td.bad{background:rgba(224,49,49,.3)}
.row{display:flex;gap:8px;margin:12px 0}.row button{flex:1}
button{font:inherit;font-weight:600;padding:11px;border-radius:10px;border:1.5px solid var(--p);background:var(--c);color:var(--p);cursor:pointer}
button.p{background:var(--p);color:#fff}button:disabled{opacity:.4}button.w2{border-color:var(--w);color:var(--w)}button.w2.on{background:var(--w);color:#fff}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.g button{padding:8px 0;border-color:var(--l);color:var(--t);font-size:14px}
.g .a{background:var(--p);color:#fff;border-color:var(--p)}.g .d{background:var(--w);color:#fff;border-color:var(--w)}
.g .cur{outline:3px solid var(--t)}.g .k{background:var(--ok);color:#fff}.g .x{background:var(--no);color:#fff}
.ex{border-left:4px solid var(--p);background:rgba(59,91,219,.08);padding:10px 12px;border-radius:8px;margin-top:10px;font-size:15px}
.big{font-size:56px;font-weight:800;color:var(--p)}.ctr{text-align:center}.lg{font-size:13px;color:var(--m)}
</style></head><body><div class="w" id="app"></div>
<script>
const S=[
{t:"Dina and the Lost Kitten",x:`<p>Dina walked home from school on a rainy afternoon. Near the market, she heard a small cry. A tiny white kitten was hiding under a box, wet and shaking. Dina wanted to take it home, but she was afraid because her mother did not like animals.</p><p>She wrapped the kitten in her scarf and carried it home anyway. Her mother was surprised and a little angry at first. But when the kitten sneezed and looked at her, she smiled. “We will keep it until we find its owner,” she said.</p><p>Two days later, no one came, so the kitten became part of the family. Dina learned that being kind can change people’s hearts.</p>`,q:[
['s','Which option best summarizes the story?',["Dina lost her kitten at the market and her mother helped her find it.","Dina’s mother found a kitten and gave it to Dina as a present.","Dina found a kitten in the rain, took it home, and her mother finally accepted it.","Dina was afraid of kittens, so she ran away from the market.","Dina sold a kitten at the market to buy a scarf."],2,"Cerita berawal dari Dina menemukan kucing, masalahnya ibunya tidak suka hewan, dan akhirnya kucing itu diterima. Opsi lain tidak sesuai cerita."],
['m','Which statements best convey the message of the story?',["Never go out when it rains","Being kind can change people’s hearts","Helping someone in need is a good thing","Mothers never like animals","Markets are the best place for kittens"],[1,2],"Pesan cerita: kebaikan bisa mengubah hati orang dan menolong yang membutuhkan itu baik. Pilihan lain tidak ada dasarnya di teks."],
['s','Why was Dina afraid to take the kitten home?',["She did not like cats","Her mother did not like animals","The kitten was too big to carry","She had no scarf","Her house was far away"],1,"Kalimat pertama paragraf 1 menyebut ibunya tidak suka hewan."],
['m','Which sentences help you understand Dina’s character?',["Dina walked home from school on a rainy afternoon.","She wrapped the kitten in her scarf.","Her mother was surprised and a little angry.","Dina wanted to take it home even though she was afraid.","Two days later, no one came."],[1,3],"Membungkus kucing dengan syal dan tetap ingin membawanya pulang menunjukkan Dina penyayang dan berani."],
['s','What does “part of the family” mean in the story?',["The kitten was loved and stayed in the house","The kitten was Dina’s real sister","The kitten went back to the market","The kitten had to leave after two days","The kitten became the mother’s teacher"],0,"“Part of the family” berarti kucing itu disayangi dan tinggal bersama mereka."]]},
{t:"Healthy Habits for Students (Infographic)",x:`<table><tr><td>1. <b>Drink Water</b><br>Drink 8 glasses a day.</td><td>2. <b>Eat Breakfast</b><br>Start the day with healthy food.</td></tr><tr><td>3. <b>Move Your Body</b><br>Exercise 30 minutes every day.</td><td>4. <b>Sleep Well</b><br>Sleep 8 hours at night.</td></tr><tr><td>5. <b>Limit Screen Time</b><br>Take a break from your phone every hour.</td><td>6. <b>Talk to Someone</b><br>Share your feelings with family or friends.</td></tr></table>`,q:[
['s','According to the infographic, how can we give our eyes a rest?',["Eat breakfast","Drink 8 glasses of water","Take a break from the phone every hour","Sleep for 8 hours","Exercise for 30 minutes"],2,"Poin 5 (Limit Screen Time) menyarankan istirahat dari ponsel setiap jam."],
['t','Decide whether each habit mainly supports physical health or mental health.',["Drink water","Talk to someone","Move your body"],[0,1,0],"Minum air dan olahraga menjaga tubuh (fisik); berbagi perasaan membantu kesehatan mental.",["Physical Health","Mental Health"]],
['s','Choose the sequence that best reflects the infographic.',["Play games → Eat candy → Sleep late → Skip breakfast → Watch TV","Eat breakfast → Exercise 30 minutes → Drink water → Rest from the phone → Sleep 8 hours","Sleep 5 hours → Drink soda → Scroll all day → Eat breakfast → Exercise","Talk to nobody → Skip exercise → Eat late → Use phone all night → Wake up late","Exercise 3 hours → Skip water → Eat breakfast at night → Sleep 4 hours → Talk to friends"],1,"Hanya opsi B yang semuanya sesuai informasi infografis."],
['m','Which statements reflect the author’s purpose?',["To sell sports equipment to students","To give students guidance for a healthier life","To explain how to cook healthy meals","To encourage students to build simple healthy habits","To prove that sleep is not important"],[1,3],"Infografis memberi panduan hidup sehat dengan kebiasaan sederhana."],
['m','You are preparing for an important exam. Which habits can you use?',["Stay up all night to study","Sleep about 8 hours before the exam","Skip meals to save time","Eat breakfast on the exam day","Share your worries with a friend or family member"],[1,3,4],"Tidur cukup, sarapan, dan bercerita pada orang dekat sesuai infografis. Begadang dan melewatkan makan bertentangan dengannya."]]},
{t:"Komodo Island",x:`<p>Komodo Island is in Indonesia, in East Nusa Tenggara. It is famous for the Komodo dragon, the biggest lizard in the world. A Komodo dragon can be three meters long and can weigh about 70 kilograms. It eats deer, birds, and even small buffalo.</p><p>The island has dry hills, green grass, and beautiful beaches with pink sand. Many tourists come to see the dragons. However, visitors must stay with a ranger because the animals can be dangerous. The government protects the island so that the dragons will not disappear.</p>`,q:[
['m','Which descriptions are mentioned clearly in the text?',["Komodo Island is in East Nusa Tenggara","Komodo dragons can fly short distances","The island has beaches with pink sand","Many tall snowy mountains cover the island","Visitors must stay with a ranger"],[0,2,4],"Tiga opsi tersebut tertulis jelas di teks. Terbang dan gunung bersalju tidak disebut."],
['s','What does “disappear” mean in the last sentence?',["Become bigger","Become more dangerous","Move to another island","No longer exist","Learn to hide"],3,"“Disappear” = menghilang / tidak ada lagi."],
['s','Which option best represents the main idea of the text?',["Komodo Island is a special place with unique animals that need protection","Komodo dragons are the best pets for tourists","Komodo Island is only a place with dry hills","Tourists should not visit any island in Indonesia","Komodo dragons eat only small buffalo"],0,"Teks membahas keunikan pulau, komodo, dan upaya melindunginya."],
['s','Which detail would best encourage people to visit Komodo Island?',["Komodo dragons can weigh about 70 kilograms","Visitors must stay with a ranger","The government protects the island","Visitors can see the world’s biggest lizard and pink-sand beaches","The island has dry hills"],3,"Daya tarik terbesar: melihat kadal terbesar di dunia dan pantai pasir pink."],
['m','Which parts support the idea that Komodo dragons are strong?',["They can be three meters long","The island has green grass","They can weigh about 70 kilograms","Many tourists come every year","They eat deer, birds, and even small buffalo"],[0,2,4],"Ukuran, berat, dan makanannya menunjukkan komodo kuat."]]},
{t:"Teenagers and Social Media",x:`<p>Many teenagers use social media every day. It helps them talk to friends, learn new things, and share ideas. But too much time online can be a problem. Some students sleep late because they scroll on their phones. Others feel sad when they compare themselves with people online.</p><p>Teenagers should set a time limit, turn off notifications while studying, and think before they post. If they use social media wisely, it can be a useful tool.</p><table><tr><th colspan=2>Survey of 100 students</th></tr><tr><td>Use social media every day</td><td>80%</td></tr><tr><td>Use it more than 4 hours a day</td><td>35%</td></tr><tr><td>Sleep late because of the phone</td><td>40%</td></tr><tr><td>Use it to find study materials</td><td>55%</td></tr><tr><td>Turn off notifications when studying</td><td>20%</td></tr></table>`,q:[
['t','Decide whether each item is a problem or a solution.',["Sleeping late because of scrolling on the phone","Setting a time limit for social media","Feeling sad after comparing yourself with others online"],[0,1,0],"Tidur larut dan merasa sedih adalah masalah; membatasi waktu adalah solusi.",["Problem","Solution"]],
['m','Which actions support wise social media use?',["Setting a time limit","Posting everything without thinking","Turning off notifications while studying","Scrolling until midnight","Thinking before posting"],[0,2,4],"Tiga saran tersebut tertulis di paragraf kedua."],
['m','Who is most likely the target audience of this text?',["Teenagers who use social media","Doctors who work in hospitals","High school students who want to balance online time and study time","Company owners who build apps","Grandparents who never use phones"],[0,2],"Teks ditulis untuk remaja/pelajar pengguna media sosial."],
['s','Which information would make the text more informative about student habits?',["A short story about a famous singer","A chart of the average hours students spend on each app every day","A paragraph about the history of mobile phones","A list of cheap phone brands","A picture of a school building"],1,"Data jam penggunaan per aplikasi relevan dengan kebiasaan siswa."],
['m','Which statements are supported by the data in the text and table?',["80% of the students use social media every day","Every student turns off notifications when studying","55% of the students use it to find study materials","Social media is bad for all teenagers","All students sleep late because of their phones"],[0,2],"Hanya angka 80% dan 55% yang ada pada tabel. Pernyataan “semua/setiap” salah."]]},
{t:"The Honest Boy",x:`<p>Raka found a brown wallet on the school field. Inside were money and an ID card. His friend Bima said, “Let’s use the money to buy snacks. No one will know.” Raka shook his head. “This is not ours,” he said. He took the wallet to the teacher’s office.</p><p>Soon, a cleaner named Mr. Ahmad came in with tears in his eyes. He had lost his wallet with his month’s salary. When he saw it, he hugged Raka and thanked him again and again. Bima felt ashamed. The next day, he told Raka, “You were right. I’m sorry.”</p>`,q:[
['s','Which option gives the most accurate chronological summary?',["Raka finds a wallet → Bima suggests using the money → Raka takes it to the teacher → Mr. Ahmad thanks Raka → Bima says sorry","Mr. Ahmad loses his wallet → Bima finds it → Bima gives it back → Raka buys snacks → Raka says sorry","Raka buys snacks → Bima finds a wallet → The teacher gets angry → Mr. Ahmad leaves → Bima thanks Raka","Bima finds a wallet → Raka wants the money → Bima shakes his head → The teacher keeps the wallet → Raka says sorry","Raka loses his wallet → Mr. Ahmad finds it → Bima takes the money → Raka hugs Bima → The school closes"],0,"Urutan A sesuai alur cerita dari awal sampai akhir."],
['m','What can we learn from the story?',["Honesty is important","Money we find belongs to us","Do the right thing even when no one is watching","Snacks are more important than honesty","It is good to admit our mistakes"],[0,2,4],"Raka jujur meski “tidak ada yang tahu”, dan Bima berani mengakui kesalahan."],
['s','Why did Mr. Ahmad have tears in his eyes?',["He was angry with the students","He lost his job at the school","He was happy to see Bima","He was sad and worried because his month’s salary was lost","He did not like Raka"],3,"Teks: ia kehilangan dompet berisi gaji sebulan."],
['m','If Raka had agreed with Bima, what would likely happen?',["Mr. Ahmad would not get his wallet back","Mr. Ahmad would hug Raka","The teacher would give Raka a prize","Raka might feel guilty later","Mr. Ahmad would lose his month’s salary"],[0,3,4],"Jika uang dipakai, Pak Ahmad kehilangan gajinya dan Raka bisa merasa bersalah. Opsi lain terjadi karena Raka jujur."],
['m','Raka is honest. This is shown when he ....',["found a wallet on the school field","said, “This is not ours.”","bought snacks with Bima","took the wallet to the teacher’s office","told Bima he was sorry"],[1,3],"Menolak memakai uang dan menyerahkan dompet ke guru menunjukkan kejujuran."]]},
{t:"Green School Week (Poster)",x:`<p><b>GREEN SCHOOL WEEK — SMA Harapan Bangsa</b><br>Date: 10–14 November · Time: 07.00–15.00 · Place: School yard</p><p><b>Activities:</b> Monday – Plant a tree · Tuesday & Wednesday – Trash bank and recycling workshop · Thursday – Bring-your-own-bottle day · Friday – Clean-up walk around the neighborhood</p><p><b>Rules:</b> Every class must join at least two activities. Bring a reusable bottle and a bag. The students who collect the most plastic bottles will win a prize.</p><p><b>Register</b> to the student council by 7 November.</p>`,q:[
['s','By when must students register?',["5 November","7 November","10 November","14 November","15 November"],1,"Tertulis: register by 7 November."],
['s','What is the purpose of this poster?',["To sell reusable bottles","To invite students to join activities that protect the environment","To announce a school holiday","To explain how to plant a tree","To ask students to pay school fees"],1,"Poster mengajak siswa ikut kegiatan peduli lingkungan."],
['s','Which activity will take place on Thursday?',["Planting a tree","Recycling workshop","Clean-up walk","Bring-your-own-bottle day","Registration"],3,"Kamis = Bring-your-own-bottle day."],
['m','Which statements are true based on the poster?',["Each class must join at least two activities","Students must pay to join","The event lasts only one day","Students should bring a reusable bottle and a bag","The students who collect the most plastic bottles will win a prize"],[0,3,4],"Acara 10–14 November (lima hari) dan tidak ada biaya yang disebut."],
['t','Decide whether each statement is true or false.',["The event takes place in the school yard","Trees will be planted on Friday","The event ends at 15.00"],[0,1,0],"Pohon ditanam hari Senin, bukan Jumat.",["True","False"]]]},
{t:"Why Read Every Day?",x:`<p>Reading is one of the best habits for students. When we read every day, we learn new words and get better at writing. Reading also makes our mind calm because we can forget our worries for a while.</p><p>You do not need to read for hours. Just 15 minutes before bed is enough. Choose books you enjoy, such as comics, novels, or science magazines. If you enjoy the book, you will want to read more. Start small, and soon reading will become a habit.</p>`,q:[
['s','Which option best represents the main idea?',["Reading comics is better than reading novels","Reading every day, even for a short time, has many benefits","Students must read for hours each night","Reading is only useful for writing","Books are better than magazines"],1,"Teks menekankan manfaat membaca setiap hari walau singkat."],
['s','What does “Start small” most likely mean?',["Buy small books","Begin with a short and easy amount of reading","Read only small words","Read in a small room","Stop reading when it is hard"],1,"“Start small” = mulai dari porsi kecil dan mudah."],
['m','Which benefits of reading are mentioned?',["You learn new words","You become taller","Your writing gets better","You get a lot of money","Your mind becomes calmer"],[0,2,4],"Kosakata baru, tulisan lebih baik, dan pikiran tenang disebut di paragraf 1."],
['s','Which detail would best encourage people to start reading?',["You must finish a book every day","You need to read for three hours","You only need about 15 minutes before bed","You can read only school books","You must read aloud to your family"],2,"Hanya 15 menit membuat kebiasaan ini terasa mudah."],
['m','Which actions can help you build a reading habit?',["Choose books you enjoy","Read only boring books","Wait until you have a free day","Read for about 15 minutes before bed","Start with a short reading time"],[0,3,4],"Pilih bacaan yang disukai, baca 15 menit, dan mulai dari sedikit."]]}
];
const Q=[];S.forEach((s,si)=>s.q.forEach(q=>Q.push({s:si,k:q[0],q:q[1],o:q[2],a:q[3],e:q[4],c:q[5]})));
let i=0,A=Q.map(()=>null),D=Q.map(()=>false),rev=false,left=3600,tm=null;
const $=id=>document.getElementById(id),L='ABCDE',N=Q.length;
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
function ok(j){const q=Q[j],a=A[j];if(q.k=='s')return a===q.a;if(!a)return false;if(q.k=='m')return a.length==q.a.length&&q.a.every(x=>a.includes(x));return q.a.every((x,r)=>a[r]===x)}
function done(j){const a=A[j];return a!=null&&(Q[j].k=='s'||(Q[j].k=='m'?a.length>0:a.some(x=>x!=null)))}
function intro(){$('app').innerHTML=`<div class="card ctr"><h1>📘 Try Out TKA Bahasa Inggris</h1><p>${N} soal · 60 menit · 7 teks bacaan</p><p class="lg">Ada pilihan ganda, pilih semua jawaban benar, dan tabel. Tandai soal yang kamu ragukan dengan tombol “Ragu-ragu”, dan kamu bisa kembali ke soal sebelumnya kapan saja. Setelah selesai, kamu bisa melihat pembahasan.</p><button class="p" onclick="start()">Mulai Mengerjakan</button></div>`}
function start(){tm=setInterval(()=>{left--;const e=$('tm');if(e)e.textContent='⏱ '+fmt(left);if(left<=0)finish(true)},1000);render()}
function pick(j,v,r){if(rev)return;const q=Q[j];if(q.k=='s')A[j]=v;else if(q.k=='m'){const a=A[j]||[],p=a.indexOf(v);p<0?a.push(v):a.splice(p,1);A[j]=a}else{const a=A[j]||[];a[r]=v;A[j]=a}render()}
function go(n){i=n;render();scrollTo(0,0)}
function ragu(){D[i]=!D[i];render()}
function render(){
const q=Q[i],s=S[q.s],a=A[i],f=q.s*5+1;let h='';
h+=`<div class="top"><span>${rev?'Pembahasan':'Soal '+(i+1)+' / '+N}</span><span id="tm">${rev?'':'⏱ '+fmt(left)}</span></div>`;
h+=`<div class="card"><span class="hd">The following text is used to answer questions ${f} to ${f+4}.</span><h3>${s.t}</h3>${s.x}</div>`;
h+=`<div class="card"><b>${i+1}. ${q.q}</b>`;
if(q.k=='m')h+=`<p class="hint">There is more than one correct answer. Click on every correct answer!</p>`;
if(q.k=='t'){h+=`<table><tr><th>Statement</th>${q.c.map(c=>`<th>${c}</th>`).join('')}</tr>`;
q.o.forEach((r,ri)=>{h+=`<tr><td>${r}</td>`;q.c.forEach((c,ci)=>{const sel=a&&a[ri]===ci,cor=q.a[ri]===ci;const cl=rev?(cor?'ok':(sel?'bad':'')):(sel?'sel':'');h+=`<td class="c ${cl}" onclick="pick(${i},${ci},${ri})">${sel?'●':(rev&&cor?'✓':'○')}</td>`});h+='</tr>'});h+='</table>'}
else q.o.forEach((t,n)=>{const sel=q.k=='s'?a===n:!!a&&a.includes(n),cor=q.k=='s'?q.a===n:q.a.includes(n);const cl=rev?(cor?'ok':(sel?'bad':'')):(sel?'sel':'');h+=`<div class="opt ${cl}" onclick="pick(${i},${n})"><span class="bx">${q.k=='s'?L[n]:(sel?'✓':'')}</span><span>${t}</span></div>`});
if(rev)h+=`<div class="ex"><b>${ok(i)?'✅ Jawabanmu benar':(done(i)?'❌ Jawabanmu kurang tepat':'⚪ Belum dijawab')}</b><br>${q.k=='s'?'Jawaban benar: '+L[q.a]+'. ':''}<b>Pembahasan:</b> ${q.e}</div>`;
h+=`</div><div class="row"><button ${i?'':'disabled'} onclick="go(${i-1})">← Sebelumnya</button>`;
if(!rev)h+=`<button class="w2 ${D[i]?'on':''}" onclick="ragu()">${D[i]?'✓ Ragu-ragu':'Ragu-ragu'}</button>`;
h+=i<N-1?`<button class="p" onclick="go(${i+1})">Selanjutnya →</button>`:(rev?`<button class="p" onclick="result()">Ke Hasil</button>`:`<button class="p" onclick="finish()">Selesai ✔</button>`);
h+=`</div><div class="card"><div class="g">${Q.map((_,j)=>{let c=j==i?'cur ':'';c+=rev?(ok(j)?'k':'x'):(D[j]?'d':(done(j)?'a':''));return`<button class="${c}" onclick="go(${j})">${j+1}</button>`}).join('')}</div>`;
h+=rev?'':`<p class="lg">Biru = terjawab · Kuning = ragu-ragu · Putih = belum dijawab</p>`;
$('app').innerHTML=h+'</div>'}
function finish(force){const u=Q.filter((_,j)=>!done(j)).length,d=D.filter(x=>x).length;
if(!force&&!confirm(`Belum dijawab: ${u} soal\nRagu-ragu: ${d} soal\n\nYakin ingin menyelesaikan try out?`))return;
clearInterval(tm);result()}
function result(){rev=false;let c=Q.filter((_,j)=>ok(j)).length,sc=Math.round(c/N*100);
$('app').innerHTML=`<div class="card ctr"><div style="font-size:48px">🎉</div><h1>Selamat!</h1><p><b>Kamu telah menyelesaikan seluruh soal try out ini. Proud of you!</b><br>Terus semangat belajar, setiap latihan membawamu lebih dekat ke hasil terbaik. Kamu hebat! 💪</p><div class="big">${sc}</div><p>Benar penuh: ${c} dari ${N} soal<br><span class="lg">Soal pilih-banyak dan tabel dinilai benar jika semua bagian tepat.</span></p><button class="p" onclick="rev=true;i=0;render()">📖 Lihat Pembahasan</button><div style="height:8px"></div><button onclick="location.reload()">🔄 Ulangi Try Out</button></div>`}
intro();
</script></body></html>
